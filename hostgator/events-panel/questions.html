<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask the Moderator — Readers' Summit 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#fefefc;
    --paper:#fdfdfb;
    --navy:#16235c;
    --navy-2:#1f3b8c;
    --ribbon:#4fa8e8;
    --gold:#c9962e;
    --gold-light:#e8c468;
    --ink:#1c2333;
    --ink-soft:#6b7080;
    --line:#e7e2d6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(79,168,232,0.07), transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, rgba(201,150,46,0.08), transparent 60%),
      var(--white);
    font-family:'Inter', system-ui, sans-serif;
    color:var(--ink);
    display:flex;
    /* Without this the <footer> is a sibling flex ITEM of .card and sits
       beside it -- which is why the credit line floated to the right of
       the card on a wide screen. Row is the flex default. */
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 18px;
  }
  .card{
    width:100%;
    max-width:600px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:0 30px 60px -30px rgba(22,35,92,0.25);
    overflow:hidden;
  }
  .card-top{
    padding:36px 40px 0;
    text-align:center;
  }
  .logo{
    max-width:280px;
    width:70%;
    height:auto;
    margin:0 auto 22px;
    display:block;
  }
  .frame{
    border:1px solid var(--gold);
    border-radius:2px;
    padding:6px 18px;
    display:inline-block;
    margin-bottom:18px;
  }
  .eyebrow{
    font-family:'Anton', sans-serif;
    letter-spacing:0.16em;
    font-size:12.5px;
    color:var(--navy);
    text-transform:uppercase;
  }
  h1{
    font-family:'Anton', sans-serif;
    font-weight:400;
    letter-spacing:0.01em;
    font-size:clamp(28px, 5vw, 38px);
    color:var(--navy);
    margin:0 0 10px;
    line-height:1.05;
  }
  h1 span{
    color:var(--gold);
    -webkit-text-fill-color: var(--gold);
    background:linear-gradient(180deg,var(--gold-light),var(--gold));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  p.sub{
    color:var(--ink-soft);
    font-size:15px;
    margin:0 auto 30px;
    max-width:420px;
    line-height:1.5;
  }
  form{
    padding:0 40px 40px;
  }
  .field{
    margin-bottom:20px;
  }
  label{
    display:block;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--navy-2);
    margin-bottom:8px;
  }
  label .opt{
    font-weight:500;
    text-transform:none;
    letter-spacing:0;
    color:var(--ink-soft);
  }
  .ruled-input{
    width:100%;
    border:none;
    border-bottom:2px solid var(--navy);
    background:transparent;
    font-family:'Inter', sans-serif;
    font-size:19px;
    font-weight:600;
    color:var(--ink);
    padding:10px 2px 12px;
    outline:none;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .ruled-input::placeholder{
    color:#b9bdc9;
    font-weight:500;
  }
  .ruled-input:focus{
    border-color:var(--gold);
  }
  .name-input{
    font-size:16px;
    font-weight:500;
    border-bottom:1.5px solid var(--line);
  }
  .name-input:focus{
    border-color:var(--ribbon);
  }
  .count{
    text-align:right;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .count.warn{ color:#b5432b; }
  button{
    width:100%;
    border:none;
    cursor:pointer;
    padding:16px 20px;
    border-radius:10px;
    font-family:'Inter', sans-serif;
    font-weight:800;
    font-size:15px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--navy);
    background:linear-gradient(180deg,var(--gold-light),var(--gold));
    box-shadow:0 10px 24px -10px rgba(201,150,46,0.6);
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  button:hover{ transform:translateY(-1px); box-shadow:0 14px 28px -10px rgba(201,150,46,0.7); }
  button:active{ transform:translateY(0); }
  button:disabled{ opacity:0.55; cursor:not-allowed; transform:none; }
  .error{
    color:#b5432b;
    font-size:13px;
    margin-top:10px;
    min-height:16px;
  }
  .success-state{
    display:none;
    padding:56px 40px 60px;
    text-align:center;
  }
  .success-state.show{ display:block; }
  form.hide{ display:none; }
  .check{
    width:56px;height:56px;border-radius:50%;
    background:linear-gradient(180deg,var(--gold-light),var(--gold));
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 18px;
    box-shadow:0 10px 24px -10px rgba(201,150,46,0.6);
  }
  .check svg{ width:26px;height:26px; }
  .success-state h2{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:24px;
    color:var(--navy);
    margin:0 0 8px;
  }
  .success-state p{
    color:var(--ink-soft);
    font-size:14.5px;
    margin:0 0 26px;
  }
  .ghost-btn{
    background:none;
    border:1.5px solid var(--navy);
    color:var(--navy);
    box-shadow:none;
    padding:12px 24px;
    width:auto;
  }
  .ghost-btn:hover{ background:var(--navy); color:#fff; box-shadow:none; }
  footer{
    text-align:center;
    padding:18px 20px 0;
    color:#b9bdc9;
    font-size:11.5px;
    letter-spacing:0.05em;
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-top">
    <img src="logo.png" alt="Pick a Book — Readers' Summit 2026" class="logo">
    <div class="frame"><span class="eyebrow">Live Q&amp;A</span></div>
    <h1>Ask the <span>moderator</span></h1>
    <p class="sub">Type your question in one line and send it straight to the stage. The moderator will work through the queue as time allows.</p>
  </div>

  <form id="qForm" autocomplete="off">
    <div class="field">
      <label for="question">Your question</label>
      <input class="ruled-input" id="question" name="question" type="text" maxlength="280" placeholder="What made you choose this year's theme?" required>
      <div class="count" id="count">280 characters left</div>
    </div>
    <div class="field">
      <label for="name">Your name <span class="opt">(optional, shown to the moderator only)</span></label>
      <input class="ruled-input name-input" id="name" name="name" type="text" maxlength="60" placeholder="e.g. Row 12, or leave blank to stay anonymous">
    </div>
    <button type="submit" id="submitBtn">Send to moderator</button>
    <div class="error" id="formError"></div>
  </form>

  <div class="success-state" id="successState">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#16235c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h2>Question sent</h2>
    <p>It's in the moderator's queue now. Thanks for joining the conversation.</p>
    <button class="ghost-btn" id="askAnother" type="button">Ask another question</button>
  </div>
</div>

<footer>PICK A BOOK · READERS' SUMMIT 2026</footer>

<script>
  const form = document.getElementById('qForm');
  const questionEl = document.getElementById('question');
  const nameEl = document.getElementById('name');
  const countEl = document.getElementById('count');
  const submitBtn = document.getElementById('submitBtn');
  const formError = document.getElementById('formError');
  const successState = document.getElementById('successState');
  const askAnother = document.getElementById('askAnother');

  function updateCount(){
    const left = 280 - questionEl.value.length;
    countEl.textContent = left + ' character' + (left === 1 ? '' : 's') + ' left';
    countEl.classList.toggle('warn', left <= 20);
  }
  questionEl.addEventListener('input', updateCount);
  updateCount();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    formError.textContent = '';
    const question = questionEl.value.trim();
    if (!question) {
      formError.textContent = 'Write your question before sending it.';
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';
    try {
      const res = await fetch('https://quiz.pickabook.lk/api/panel/questions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, name: nameEl.value.trim() })
      });
      const data = await res.json();
      if (!res.ok || !data.success) {
        throw new Error(data.error || 'Something went wrong. Try again.');
      }
      form.classList.add('hide');
      successState.classList.add('show');
    } catch (err) {
      formError.textContent = err.message || 'Something went wrong. Try again.';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send to moderator';
    }
  });

  askAnother.addEventListener('click', () => {
    questionEl.value = '';
    nameEl.value = '';
    updateCount();
    successState.classList.remove('show');
    form.classList.remove('hide');
    questionEl.focus();
  });
</script>

</body>
</html>
